# For documentation of the backend_config.ini file see
# https://github.com/zonemaster/zonemaster/blob/master/docs/public/configuration/backend.md

[DB]
engine            = SQLite
polling_interval  = 0.5

[MYSQL]
host     = localhost
user     = zonemaster
password = zonemaster
database = zonemaster

[POSTGRESQL]
host     = localhost
user     = zonemaster
password = zonemaster
database = zonemaster

[SQLITE]
database_file = /var/lib/zonemaster/db.sqlite

[ZONEMASTER]
#max_zonemaster_execution_time            = 600
#number_of_processes_for_frontend_testing = 20
#number_of_processes_for_batch_testing    = 20
#lock_on_queue                            = 0
#age_reuse_previous_test                  = 600

[RPCAPI]
# Uncomment and set a valid key matching /^[a-zA-Z0-9]{10,64}$/ to use an API key
#batch_api_key = aaaa
# Uncomment to enable API method "add_api_user" (deprecated to be removed by
# Zonemaster version v2027.1)
#enable_add_api_user = true

# API methods "add_batch_job" and "batch_create" can be disabled either by
# setting "enable_add_batch_job" or "enable_batch_create" to "false". Both
# keys may not be explicitly set. Both are true by default.
# "enable_add_batch_job" is deprecated to be removed by Zonemaster version
# v2027.1.
#enable_add_batch_job = false
#enable_batch_create = false

# Uncomment and select a value (default 5)
#max_anonymous_batch_size = 10

[LANGUAGE]
locale = da_DK en_US es_ES fi_FI fr_FR nb_NO sl_SI sv_SE

[PUBLIC PROFILES]
#example_profile_1=/example/directory/test1_profile.json
#default=/example/directory/default_profile.json

[PRIVATE PROFILES]
#example_profile_2=/example/directory/test2_profile.json

[METRICS]
# Uncoment the following option to enable the metrics feature
#statsd_host = localhost
#statsd_port = 8125

[TLD URL SETTINGS]
#enable_tld_url   =  true
#lookup_timeout   =  3
#include_source   =  true

[TLD URL OVERRIDE]
#xa         = [BLOCK]
#xn--4cab6c = [BLOCK]
#xb         = http://nic.xb/domain
#example    = https://whoisweb.noc.example/domain/[DOMAIN]
