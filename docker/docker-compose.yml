services:
  postgres:
    image: postgres:18-alpine
    hostname: postgres
    environment:
      POSTGRES_DB: zonemaster
      POSTGRES_USER: zonemaster
      POSTGRES_PASSWORD: REPLACE-THIS-BY-YOUR-OWN-PASSWORD
    volumes:
      - ./postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zonemaster -d zonemaster"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    image: zonemaster/backend:latest
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - >-
        perl -MFile::ShareDir -le
        'system("perl", File::ShareDir::dist_file("Zonemaster-Backend", "create_db.pl"));
        exit($? >> 8)'
    volumes:
      - ./backend_config.ini:/etc/zonemaster/backend_config.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  zm-rpcapi:
    image: zonemaster/backend:latest
    hostname: zm-rpcapi
    command: ["rpcapi"]
    volumes:
      - ./backend_config.ini:/etc/zonemaster/backend_config.ini:ro
    depends_on:
      db-init:
        condition: service_completed_successfully

  zm-test-agent:
    image: zonemaster/backend:latest
    command: ["testagent"]
    volumes:
      - ./backend_config.ini:/etc/zonemaster/backend_config.ini:ro
    deploy:
      replicas: 2
    depends_on:
      db-init:
        condition: service_completed_successfully

  zm-gui:
    image: zonemaster/gui:latest
    ports:
      - "80:80"
#    volumes:
#    # for custom banner
#      - ./config.json:/usr/local/apache2/htdocs/config.json:ro
    depends_on:
      - zm-rpcapi

